[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-touch-clm-backend"
version = "0.1.0"
description = "Mock-first FastAPI orchestration for the Zero-Touch CLM proof of concept"
requires-python = ">=3.12"
dependencies = [
    # D-cert (fast-track A1): the GoldTier Sandbox trust store is certifi's bundle
    # (goldtier_tls_context). Declared and pinned to the version in the tested G2 backend image.
    "certifi==2026.10.23",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pymongo==4.18.3",
    "pydantic-settings==2.15.0",
    "pypdf==6.21.4",
    "Pillow==13.0.0",
    "pypdfium2==5.15.2",
    # FastAPI accepts any Starlette >=0.46; pinned to the version every suite is validated on
    # (a fresh resolve took 1.10.0, whose TestClient changes how an interrupted request ends).
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
    "mypy==1.20.2",
    "pytest==8.4.2",
    "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
