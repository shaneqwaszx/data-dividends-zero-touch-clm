[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-ai-assistant"
version = "0.1.0"
description = "AI Assistant service for the Zero-Touch CLM proof of concept (read-only toward the CLM backend; keeps its own reviewed knowledge store)"
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    # FastAPI accepts any Starlette >=0.46; pinned to the version every suite is validated on
    # (a fresh resolve took 1.10.0, whose TestClient changes how an interrupted request ends).
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
    "mypy==1.20.2",
    "pytest==8.4.2",
    "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_assistant*"]

[tool.setuptools.package-data]
ai_assistant = ["instructions/*.md", "knowledge/guidance/*.md", "knowledge/seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
