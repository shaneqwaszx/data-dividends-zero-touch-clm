name: Project CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/backend/pyproject.toml
            apps/assistant/pyproject.toml
      # The backend suite includes tests/test_ai_assistant_main_integration.py, which imports
      # the AI Assistant service; its pinned dependencies (chromadb) come from its own package.
      - run: python -m pip install -e ".[dev]" -e "../assistant"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m mypy app
      - run: python -m pytest
      - run: python -m unittest discover -s ../../tests/contract -p "test_*.py"
      - run: python -m unittest discover -s ../../tests -p "test_phase_07_delivery_assets.py"

  assistant:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/assistant/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check ai_assistant assistant_eval assistant_hosting tests scripts
      - run: python -m mypy ai_assistant assistant_eval assistant_hosting
      - run: python -m pytest

  local-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f scripts/ocr_validation.Dockerfile -t clm-local-ocr-validation .
      - name: Real local OCR acceptance with networking disabled
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,size=256m --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 128
          --memory 1g --cpus 2 --user 65534:65534
          clm-local-ocr-validation python -B -m pytest
          apps/backend/tests/test_s2_local_ocr.py -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm ls --all
      - run: npm run e2e:list
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  phase12-mongo:
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PHASE12_MONGO_URI: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python ../../scripts/run_physical_mongo_tests.py

  e2e-shards:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Each isolated lifecycle's runner deadline (180 s) covers server readiness plus
    # Playwright's default 120 s per-test timeout, so Playwright, not the runner, times out a
    # slow test and names the failing step; the runner deadline still stops a hung process.
    # Six tests set a longer test.setTimeout (180-240 s); for them the runner bound fires first
    # (they currently finish in under 50 s).
    # 127 discovered lifecycles partition into at most 43 per shard, with all tests retained.
    # Largest shard: 43 * (180s execution + 120s cleanup) + 60s = 216 minutes.
    # Keep the existing job deadline and 14-minute installation allowance.
    timeout-minutes: 234
    services:
      mongo:
        image: mongo:7
        ports:
          - 27185:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      # D-118 usability: the real-stack AI Models spec starts the assistant service itself.
      - run: python -m pip install -e "apps/backend[dev]" -e "apps/assistant"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: npm ci
        working-directory: apps/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - run: python scripts/run_e2e.py --timeout-seconds 180 --shard ${{ matrix.shard }}/3

  e2e:
    runs-on: ubuntu-24.04
    needs: e2e-shards
    if: ${{ always() }}
    steps:
      - name: Require every browser shard to succeed
        run: test "${{ needs['e2e-shards'].result }}" = "success"

  demo-lifecycle-windows:
    runs-on: windows-latest
    # Checkout must retain archived evidence paths longer than Windows MAX_PATH.
    # Command-scope configuration reaches checkout without changing host settings.
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install -e ".\apps\backend[dev]"
      - run: npm ci
        working-directory: apps/frontend
      - run: .\.venv\Scripts\python.exe -m unittest discover -s tests -p "test_demo_lifecycle_windows.py" -v

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_check_secrets.py"
      - run: python -m unittest discover -s tests -p "test_pre_pr_check.py"
      - run: python -m unittest tests.test_dev_context tests.test_check_project_state tests.test_check_architecture -v
      - run: python -m unittest discover -s tests -p "test_check_policy_authority.py" -v
      - run: python -m unittest discover -s tests -p "test_check_external_provider_readiness.py" -v
      - run: python -m unittest discover -s tests -p "test_claude_skill_pointers.py" -v
      - run: python -m pip install -r scripts/requirements-contract-validation.txt
      - run: python -m unittest discover -s tests -p "test_validate_external_provider_evidence.py" -v
      - run: python scripts/check_project_state.py
      - run: python scripts/check_architecture.py
      - run: python scripts/check_tooling_config.py
      - run: python scripts/check_policy_authority.py
      - run: python scripts/check_external_provider_readiness.py
      - run: python scripts/check_secrets.py
      - run: python -m unittest discover -s tests -p "test_validate_goldtier_examples.py"
      - run: python scripts/validate_goldtier_examples.py --if-present
